---
######################
# Platform - Globals #
######################
platform_globals:
  production:
    https_port: &platform_globals_prod_https_port "443"
    https_redirect_port: &platform_globals_prod_https_redirect_port "8443"
    internal_network_dns_ip: &platform_globals_prod_internal_network_dns_ip
      "{{ facts_platform_environment.external_server.production.platform_internal_network_dns }}"
    landing_page_title: "Collabsuite (v2.0)"
  staging:
    https_port: &platform_globals_staging_https_port "8444"
    https_redirect_port: &platform_globals_staging_https_redirect_port "8444"
    internal_network_dns_ip: &platform_globals_staging_internal_network_dns_ip
      "{{ facts_platform_environment.external_server.staging.platform_internal_network_dns }}"
    landing_page_title: "Collabsuite (v2.0 - staging)"
  rfc1918:
    class_a: &platform_globals_rfc1918_class_a "10.0.0.0/8"
    class_b: &platform_globals_rfc1918_class_b "172.16.0.0/12"
    class_c: &platform_globals_rfc1918_class_c "192.168.0.0/16"
  rfc1918_networks: &platform_globals_rfc1918_networks
    - *platform_globals_rfc1918_class_a
    - *platform_globals_rfc1918_class_b
    - *platform_globals_rfc1918_class_c
  servers:
    domain_name_provider: &platform_globals_dns "dns.collabsuite.lan"
    platform_server_1: &platform_globals_server_1 "server-1.collabsuite.lan"
    platform_server_2: &platform_globals_server_2 "server-2.collabsuite.lan"
    platform_server_3: &platform_globals_server_3 "server-3.collabsuite.lan"

platform_global_external_gateway:
  production: &platform_global_external_gateway_prod_info
    domain: &platform_global_external_gateway_prod_domain "{{ facts_platform_environment.external_server.production.domain }}"
    domain_web: &platform_global_external_gateway_prod_domain_web "{{ facts_platform_environment.external_server.production.domain_web }}"
    domain_email: "{{ facts_platform_environment.external_server.production.domain_email }}"
    server: &platform_globals_external_gateway_prod_server "ext-gw.collabsuite.lan"
    server_ip: &platform_globals_prod_external_gateway_ip "{{ facts_platform_environment.external_server.production.ip }}"
    port: *platform_globals_prod_https_port
  staging: &platform_global_external_gateway_staging_info
    domain: &platform_global_external_gateway_staging_domain "{{ facts_platform_environment.external_server.staging.domain }}"
    domain_web: &platform_global_external_gateway_staging_domain_web "{{ facts_platform_environment.external_server.staging.domain_web }}"
    domain_email: "{{ facts_platform_environment.external_server.staging.domain_email }}"
    server: &platform_globals_external_gateway_staging_server "ext-gw.collabsuite.lan"
    server_ip: &platform_globals_staging_external_gateway_ip "{{ facts_platform_environment.external_server.staging.ip }}"
    port: *platform_globals_staging_https_port

platform_global_internal_gateway:
  production: &platform_global_internal_gateway_prod_info
    server: &platform_global_internal_gateway_prod_server "int-gw.collabsuite.lan"
    port: *platform_globals_prod_https_port
  staging: &platform_global_internal_gateway_staging_info
    server: &platform_global_internal_gateway_staging_server "int-gw.collabsuite.lan"
    port: *platform_globals_staging_https_port

platform_global_identity_provider:
  production: &platform_global_identity_provider_prod_info
    fqdn_server: &platform_global_identity_provider_prod_server "identity.collabsuite.lan"
    firewall_port: *platform_globals_prod_https_port
    service_uri: &platform_identity_provider_prod_service_uri "auth"
  staging: &platform_global_identity_provider_staging_info
    fqdn_server: &platform_global_identity_provider_staging_server "identity.collabsuite.lan"
    firewall_port: *platform_globals_staging_https_port
    service_uri: &platform_identity_provider_staging_service_uri "auth"

########################################
# Platform - Container Service Globals #
########################################
platform_oci_container_service_globals:
  network_name: "service_network"
  network_subnet: &platform_oci_container_service_globals_network_subnet "10.89.0.0/24"
  network_gateway: "10.89.0.1"
  network_dns: &platform_oci_container_service_globals_network_dns "10.89.0.1"

#########################################
# Platform - Container Registry Globals #
#########################################
platform_registry_globals:
  arch:
    arm64: &platform_registry_globals_arch_arm64 "arm64"
    amd64: &platform_registry_globals_arch_amd64 "amd64"
  platform:
    linux_arm64: &platform_registry_globals_linux_arm64 "linux/arm64"
    linux_amd64: &platform_registry_globals_linux_amd64 "linux/amd64"
  production:
    platform_username: &platform_service_quayio_prod_platform_username "collabsuite"
    platform_registry_path: "collabsuite/platform/v2.0"
  staging:
    platform_username: &platform_service_quayio_staging_platform_username "stagingcollabsuite"
    platform_registry_path: "stagingcollabsuite/platform/v2.0"

###############################
# Platform - Container Images #
###############################
platform_container_images_prod_platform_registry_path: "{{ platform_registry_globals.production.platform_registry_path }}"
platform_container_images_prod_registry_image_path: "{{ platform_service_quayio.production.fqdn_server }}:{{ platform_service_quayio.production.firewall_port }}/{{ platform_registry_globals.production.platform_registry_path }}"

platform_container_images_staging_platform_registry_path: "{{ platform_registry_globals.staging.platform_registry_path }}"
platform_container_images_staging_registry_image_path: "{{ platform_service_quayio.staging.fqdn_server }}:{{ platform_service_quayio.staging.firewall_port }}/{{ platform_registry_globals.staging.platform_registry_path }}"

platform_container_images:
  openresty:
    production:
      platform_registry_path: &platform_container_images_openresty_prod_platform_registry_path "{{ platform_container_images_prod_platform_registry_path }}/openresty"
      platform_registry_build_platform_arches:
        - *platform_registry_globals_linux_arm64
        - *platform_registry_globals_linux_amd64
      image_name: &platform_container_images_openresty_prod_image_name "{{ platform_container_images_prod_registry_image_path }}/openresty"
      image_tag: &platform_container_images_openresty_prod_image_tag "1.27.4.1-0-noble-0"
      inline_container_file:
        "FROM docker.io/openresty/openresty:1.27.1.1-0-noble\n
        RUN luarocks install lua-resty-openidc\n
        RUN luarocks install lua-resty-http\n
        RUN luarocks install lua-resty-session"
    staging:
      platform_registry_path: &platform_container_images_openresty_staging_platform_registry_path "{{ platform_container_images_staging_platform_registry_path }}/openresty"
      platform_registry_build_platform_arches:
        - *platform_registry_globals_linux_arm64
        - *platform_registry_globals_linux_amd64
      image_name: &platform_container_images_openresty_staging_image_name "{{ platform_container_images_staging_registry_image_path }}/openresty"
      image_tag: &platform_container_images_openresty_staging_image_tag "1.27.4.1-0-noble-0"
      inline_container_file:
        "FROM docker.io/openresty/openresty:1.27.1.1-0-noble\n
        RUN luarocks install lua-resty-openidc\n
        RUN luarocks install lua-resty-http\n
        RUN luarocks install lua-resty-session"
  keycloak:
    production:
      platform_registry_path: &platform_container_images_keycloak_prod_platform_registry_path "{{ platform_container_images_prod_platform_registry_path }}/keycloak"
      image_name: &platform_container_images_keycloak_prod_image_name "{{ platform_container_images_prod_registry_image_path }}/keycloak"
      image_tag: &platform_container_images_keycloak_prod_image_tag "26.0.1-0"
    staging:
      platform_registry_path: &platform_container_images_keycloak_staging_platform_registry_path "{{ platform_container_images_staging_platform_registry_path }}/keycloak"
      image_name: &platform_container_images_keycloak_staging_image_name "{{ platform_container_images_staging_registry_image_path }}/keycloak"
