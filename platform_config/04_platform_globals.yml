    worker_keycloak_image_name: *platform_container_images_keycloak_staging_image_name
    worker_keycloak_image_tag: *platform_container_images_keycloak_staging_image_tag
    service_uri: *platform_identity_provider_staging_service_uri
    auth_realm: "master"
    user_realm: "master"
    bootstrap_admin_username: "stagingbootstrapadmin"
