platform_service_quayio:
  production:
    fqdn_service: "registry-{{ ansible_service_domain }}"
    fqdn_server: *platform_globals_server_1
    firewall_port: *platform_globals_prod_https_port
    server_port: *platform_globals_prod_https_redirect_port
    service_image_name: *platform_container_images_nginx_prod_image_name
    service_image_tag: *platform_container_images_nginx_prod_image_tag
    worker_quay_image_name: *platform_container_images_quay_io_prod_image_name
    worker_quay_image_tag: *platform_container_images_quay_io_prod_image_tag
    worker_pgsql_image_name: *platform_container_images_postgres_16_prod_external_registry_path
    worker_pgsql_image_tag: *platform_container_images_postgresql_16_prod_image_tag
    worker_redis_image_name: *platform_container_images_redis_prod_external_registry_path
    worker_redis_image_tag: *platform_container_images_redis_prod_image_tag
    service_uri: ""
    max_body_size_in_megabytes: 6000
    admin_username: "quayadmin"
    admin_email: "quayadmin@{{ ansible_service_domain }}"
    platform_username: *platform_service_quayio_prod_platform_username
    platform_user_email: "collabsuiteplatform@{{ ansible_service_domain }}"
    service_account: &platform_service_quayio_prod_service_account
      username: &platform_service_quayio_prod_username "quayio"
      gecos: "quay.io user"
    service_forward_port: &platform_service_quayio_prod_forward_port
      destination_port: *platform_globals_prod_https_port
      protocol: "tcp"
      redirect_port: *platform_globals_prod_https_redirect_port
      service_name: *platform_service_quayio_prod_username
      username: *platform_service_quayio_prod_username
      restricted_to_ipv4_with_cidr: *platform_globals_rfc1918_class_a
    branding_long_title: "Collabsuite Platform Registry"
    branding_short_title: "Collabsuite Platform Registry"
  staging:
    fqdn_service: "stagingregistry-{{ ansible_service_domain }}"
    fqdn_server: *platform_globals_server_1
    firewall_port: *platform_globals_staging_https_port
    server_port: *platform_globals_staging_https_redirect_port
    service_image_name: *platform_container_images_nginx_prod_image_name
    service_image_tag: *platform_container_images_nginx_staging_image_tag
    worker_quay_image_name: *platform_container_images_quay_io_staging_image_name
    worker_quay_image_tag: *platform_container_images_quay_io_staging_image_tag
    worker_pgsql_image_name: *platform_container_images_postgres_16_staging_external_registry_path
    worker_pgsql_image_tag: *platform_container_images_postgresql_16_staging_image_tag
    worker_redis_image_name: *platform_container_images_redis_staging_external_registry_path
    worker_redis_image_tag: *platform_container_images_redis_staging_image_tag
    service_uri: ""
    max_body_size_in_megabytes: 6000
    admin_username: "stagingquayadmin"
    admin_email: "stagingquayadmin@{{ ansible_service_domain }}"
    platform_username: *platform_service_quayio_staging_platform_username
    platform_user_email: "collabsuiteplatform@{{ ansible_service_domain }}"
    service_account: &platform_service_quayio_staging_service_account
      username: &platform_service_quayio_staging_username "stagingquayio"
      gecos: "quay.io user (staging)"
    service_forward_port: &platform_service_quayio_staging_forward_port
      destination_port: *platform_globals_staging_https_port
      protocol: "tcp"
      redirect_port: *platform_globals_staging_https_redirect_port
      service_name: *platform_service_quayio_staging_username
      username: *platform_service_quayio_staging_username
      restricted_to_ipv4_with_cidr: *platform_globals_rfc1918_class_a
    branding_long_title: "Collabsuite Platform Registry (staging)"
    branding_short_title: "Collabsuite Platform Registry (staging)"

platform_service_keycloak:
  production:
    fqdn_service: "keycloak-{{ ansible_service_domain }}"
    fqdn_service_external: "keycloak-external-{{ ansible_service_domain }}"
    fqdn_server: *platform_global_identity_provider_prod_server
    external_fqdn_server: *platform_globals_external_gateway_prod_server
    external_gateway_ip: *platform_globals_prod_external_gateway_ip
    firewall_port: *platform_globals_prod_https_port
    server_port: *platform_globals_prod_https_redirect_port
    service_image_name: *platform_container_images_nginx_prod_image_name
    service_image_tag: *platform_container_images_nginx_prod_image_tag
    worker_pgsql_image_name: *platform_container_images_postgresql_16_prod_image_name
    worker_pgsql_image_tag: *platform_container_images_postgresql_16_prod_image_tag
    worker_keycloak_image_name: *platform_container_images_keycloak_prod_image_name
    worker_keycloak_image_tag: *platform_container_images_keycloak_prod_image_tag
    service_uri: *platform_identity_provider_prod_service_uri
    auth_realm: "master"
    user_realm: "master"
    bootstrap_admin_username: "bootstrapadmin"
    admin_username: "admin"
    admin_user_email: "keycloakadmin@{{ ansible_service_domain }}"
    max_queued_requests: 40
    openid_client_info: &platform_service_keycloak_prod_openid_client_info
      security_realm_display_name: "CollabSuite v2.0"
      security_realm: "collab-suite-v2.0"
      security_realm_id: "collab-suite-v2.0"
      base_uri: "auth/realms/collab-suite-v2.0"
      discovery_uri: ".well-known/openid-configuration"
      auth_uri: "protocol/openid-connect/auth"
      token_uri: "protocol/openid-connect/token"
      api_uri: "protocol/openid-connect/userinfo"
      redirect_after_logout_uri: "protocol/openid-connect/logout"
      client_redirect_uri_suffix: "redirect_uri"
      web_origins: &platform_service_keycloak_prod_client_domain "{{ facts_platform_environment.external_server.production.domain }}"
      base_secret_file_path: "{{ platform_management_openid_path }}/openid_client_secret_"
      identity_provider_gateway: *platform_global_external_gateway_prod_info
      internationalization_enabled: true
      login_with_email_allowed: true
      reset_password_allowed: true
      sso_session_idle_timeout_in_mins: 15
      sso_session_max_lifespan_in_hours: 8
      offline_session_idle_timeout_days: 2
      offline_session_max_lifespan_days: 5
      offline_session_max_lifespan_enabled: true
    service_account: &platform_service_keycloak_prod_service_account
      username: &platform_service_keycloak_prod_username "keycloak"
      gecos: "keycloak user"
    service_forward_port: &platform_service_keycloak_prod_forward_port
      destination_port: *platform_globals_prod_https_port
      protocol: "tcp"
      redirect_port: *platform_globals_prod_https_redirect_port
      service_name: *platform_service_keycloak_prod_username
      username: *platform_service_keycloak_prod_username
      restricted_to_ipv4_with_cidr: *platform_globals_rfc1918_class_a
    http_gateway: *platform_global_external_gateway_prod_info
