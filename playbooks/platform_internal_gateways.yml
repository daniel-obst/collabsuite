---
- name: Platform (internal gateways) - environment
  hosts: platform_internal_gateways
  tags: [servers, platform_internal_gateways_servers, services, services_internal_gateway]
  connection: local
  become: false
  roles:
    - role: facts_platform_server
      vars:
        facts_platform_server_password_file: "internal_gateways_management_user"
        facts_platform_server_config: "{{ platform_internal_gateway_server_config }}"
    - role: platform_container_server_init
      vars:
        platform_container_server_init_server_configs: "{{ platform_internal_gateway_server_config }}"

- name: Platform (internal gateways) - deploy servers
  hosts: platform_internal_gateways
  tags: [servers, platform_internal_gateways_servers]
  become: true
  vars:
    ansible_user: "{{ platform_management_username }}"
    ansible_ssh_private_key_file: "{{ facts_platform_server_management_user_private_key_file }}"
  roles:
    - role: platform_container_server
      vars:
        platform_container_server_config: "{{ platform_internal_gateway_server_config }}"

# Service: internal gateway #
- name: Platform (internal gateways) - deploy gateway
  hosts: platform_internal_gateways
  tags: [services, services_internal_gateway]
  connection: local
  become: false
  roles:
    - role: service_internal_gateway_init

- name: Platform (internal gateways) - deploy gateway (service)
  hosts: platform_internal_gateways
  tags: [services, services_internal_gateway]
  become: false
  vars:
    ansible_user: "{{ fact_oci_container_service_init_username }}"
    ansible_ssh_private_key_file: "{{ fact_oci_container_service_init_private_key_file }}"
  roles:
    - role: service_internal_gateway
    - role: service_landing_page
