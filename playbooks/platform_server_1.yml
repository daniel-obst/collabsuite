---
- name: Platform (server 1) - environment
  hosts: platform_server_1
  tags: [servers, platform_server_1_servers, services, services_quay_io]
  connection: local
  become: false
  roles:
    - role: facts_platform_server
      vars:
        facts_platform_server_password_file: "platform_server_1_management_user"
        facts_platform_server_config: "{{ platform_server_1_server_config }}"
    - role: platform_container_server_init
      vars:
        platform_container_server_init_server_configs: "{{ platform_server_1_server_config }}"

- name: Platform (server 1) - deploy servers
  hosts: platform_server_1
  tags: [servers, platform_server_1_servers]
  become: true
  vars:
    ansible_user: "{{ platform_management_username }}"
    ansible_ssh_private_key_file: "{{ facts_platform_server_management_user_private_key_file }}"
  roles:
    - role: platform_container_server
      vars:
        platform_container_server_config: "{{ platform_server_1_server_config }}"

# Service: Quay.io #
- name: Platform (server 1) - deploy quay.io 
  hosts: platform_server_1
  tags: [services, services_quay_io]
  connection: local
  become: false
  roles:
    - role: service_quay_io_init

- name: Services (1) - deploy Quay.io (service)
  hosts: platform_server_1
  tags: [services, services_quay_io]
  become: false
  vars:
    ansible_user: "{{ fact_oci_container_service_init_username }}"
    ansible_ssh_private_key_file: "{{ fact_oci_container_service_init_private_key_file }}"
  roles:
    - role: service_quay_io
