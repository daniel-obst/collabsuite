---
- name: Platform (server 2) - environment
  hosts: platform_server_2
  tags: [servers, platform_server_2_servers, services, services_node_red, services_drawio, 
        services_pgadmin4, services_rstudio, services_code_server, services_collabora,
        services_data_science_notebook, services_it_tools]
  connection: local
  become: false
  roles:
    - role: facts_platform_server
      vars:
        facts_platform_server_password_file: "platform_server_2_management_user"
        facts_platform_server_config: "{{ platform_server_2_server_config }}"
    - role: platform_container_server_init
      vars:
        platform_container_server_init_server_configs: "{{ platform_server_2_server_config }}"

- name: Platform (server 2) - deploy servers
  hosts: platform_server_2
  tags: [servers, platform_server_2_servers]
  become: true
  vars:
    ansible_user: "{{ platform_management_username }}"
    ansible_ssh_private_key_file: "{{ facts_platform_server_management_user_private_key_file }}"
  roles:
    - role: platform_container_server
      vars:
        platform_container_server_config: "{{ platform_server_2_server_config }}"

# Service: node-red #
- name: Platform (server 2) - node-red (service)
  hosts: platform_server_2
  tags: [services, services_node_red]
  connection: local
  become: false
  roles:
    - role: service_node_red_init

- name: Services (2) - node-red (service - deploy)
  hosts: platform_server_2
  tags: [services, services_node_red]
  become: false
  vars:
    ansible_user: "{{ fact_oci_container_service_init_username }}"
    ansible_ssh_private_key_file: "{{ fact_oci_container_service_init_private_key_file }}"
  roles:
    - role: service_node_red

