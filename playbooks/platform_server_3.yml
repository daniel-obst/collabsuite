---
- name: Platform (server 3) - environment
  hosts: platform_server_3
  tags: [servers, platform_server_3_servers, services, services_gitlab_ce, services_nextcloud, 
        services_grafana, services_redmine, services_node_red_pgsql, services_openproject,
        #services_ckan
        ]
  connection: local
  become: false
  roles:
    - role: facts_platform_server
      vars:
        facts_platform_server_password_file: "platform_server_3_management_user"
        facts_platform_server_config: "{{ platform_server_3_server_config }}"
    - role: platform_container_server_init
      vars:
        platform_container_server_init_server_configs: "{{ platform_server_3_server_config }}"

- name: Platform (server 3) - deploy servers
  hosts: platform_server_3
  tags: [servers, platform_server_3_servers]
  become: true
  vars:
    ansible_user: "{{ platform_management_username }}"
    ansible_ssh_private_key_file: "{{ facts_platform_server_management_user_private_key_file }}"
  roles:
    - role: platform_container_server
      vars:
        platform_container_server_config: "{{ platform_server_3_server_config }}"

# Service: gitlab-ce #
- name: Platform (server 3) - gitlab-ce (service)
  hosts: platform_server_3
  tags: [services, services_gitlab_ce]
  connection: local
  become: false
  roles:
    - role: service_gitlab_ce_init

- name: Services (3) - gitlab-ce (service - deploy)
  hosts: platform_server_3
  tags: [services, services_gitlab_ce]
  become: false
  vars:
    ansible_user: "{{ fact_oci_container_service_init_username }}"
    ansible_ssh_private_key_file: "{{ fact_oci_container_service_init_private_key_file }}"
  roles:
    - role: service_gitlab_ce

