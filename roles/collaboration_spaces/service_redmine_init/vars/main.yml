---
service_redmine_init_config: "{{ ansible_deploy_production
  | ansible.builtin.ternary(platform_service_redmine.production, platform_service_redmine.staging) }}"

service_redmine_init_username: "{{ service_redmine_init_config.service_account.username }}"
service_redmine_init_fqdn_service: "{{ service_redmine_init_config.fqdn_service }}"
service_redmine_init_fqdn_server: "{{ service_redmine_init_config.fqdn_server }}"
