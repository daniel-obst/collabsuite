---
- name: Service (redmine) - init
  when: facts_machine_linux_distro
  block:
    - name: Service (redmine) - container service init
      ansible.builtin.include_role:
        name: oci_container_service_init
      vars:
        oci_container_service_init_username: "{{ service_redmine_init_username }}"
        oci_container_service_init_fqdn_service: "{{ service_redmine_init_fqdn_service }}"
        oci_container_service_init_fqdn_server: "{{ service_redmine_init_fqdn_server }}"
