---
service_collabora_config: "{{ ansible_deploy_production
  | ansible.builtin.ternary(platform_service_collabora.production, platform_service_collabora.staging) }}"

service_collabora_config_http_gateway: "{{ service_collabora_config.http_gateway }}"

service_collabora_env_prefix: "collabora_"

# web proxy config
service_collabora_server_firewall_port: "{{ service_collabora_config.firewall_port }}"
service_collabora_fqdn_server: "{{ service_collabora_config.fqdn_server }}"
service_collabora_service_network_dns: "{{ platform_oci_container_service_globals.network_dns }}"
service_collabora_config_cert_file_path: "{{ fact_oci_container_service_init_cert_file }}"
service_collabora_config_key_file_path: "{{ fact_oci_container_service_init_key_file }}"
service_collabora_config_dh_file_path: "{{ fact_oci_container_service_init_dh_file }}"
service_collabora_config_ca_cert_file_path: "{{ fact_oci_container_service_init_ca_cert_file }}"

service_collabora_config_reverse_proxy_additional_headers: []
service_collabora_config_reverse_proxy_enable_web_socket: true

# locations.conf
service_collabora_service_uri: "{{ service_collabora_config.service_uri }}"
service_collabora_worker: "collabora_worker"
service_collabora_server_url: "https://{{ service_collabora_worker }}:9980"
service_collabora_config_reverse_proxy_conf_container_path: "{{ fact_tls_web_proxy_config_reverse_proxy_conf_container_path }}"
service_collabora_locations_conf_server_path: "{{ fact_tls_web_proxy_config_includes_dir }}/locations.conf"

# podman environment
service_collabora_admin_username: "{{ service_collabora_config.admin_username }}"
service_collabora_password_file_path:
  "{{ platform_management_passwords_path }}/{{ service_collabora_env_prefix }}{{ service_collabora_config.username }}"
service_collabora_server_name_with_port: "{{ service_collabora_config_http_gateway.server_ip }}:{{ service_collabora_config_http_gateway.port }}"
service_collabora_alias_group_1: "https://{{ service_collabora_config_http_gateway.server_ip }}:{{ service_collabora_config_http_gateway.port }}"
service_collabora_domain: "{{ ansible_host_domain }}"
service_collabora_service_root: "/{{ service_collabora_config.service_uri }}"
service_collabora_podman_environment_server_path: "{{ fact_tls_web_proxy_config_dir }}/podman_environment"

# service
service_collabora_oci_service:
  image_name: "{{ service_collabora_config.service_image_name }}"
  image_tag: "{{ service_collabora_config.service_image_tag }}"
  service_name: "{{ service_collabora_config.service_account.username }}"
  server_dest_port: "{{ service_collabora_config.server_port }}"
  container_dest_port: "{{ service_collabora_config.firewall_port }}"
  volumes: []
  readonly_volumes: "{{ fact_tls_web_proxy_config_readonly_volumes }}"
  env_file: ""
  added_capabilities: []

service_collabora_oci_service_workers:
  - image_name: "{{ service_collabora_config.worker_image_name }}"
    image_tag: "{{ service_collabora_config.worker_image_tag }}"
    env_file: "{{ service_collabora_podman_environment_server_path }}"
    added_capabilities:
      - "MKNOD"
      - "SYS_ADMIN"
    containers:
      - container_name: "{{ service_collabora_worker }}"
        volumes: []
        readonly_volumes: []
