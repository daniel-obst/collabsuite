---
- name: Service (grafana)
  when: facts_machine_linux_distro
  block:
    - name: Service (grafana) - TLS web proxy configuration
      ansible.builtin.include_role:
        name: tls_web_proxy_service_config
      vars:
        tls_web_proxy_service_config_server_firewall_port: "{{ service_grafana_server_firewall_port }}"
        tls_web_proxy_service_config_fqdn_server: "{{ service_grafana_fqdn_server }}"
        tls_web_proxy_service_config_cert_file_path: "{{ service_grafana_config_cert_file_path }}"
        tls_web_proxy_service_config_key_file_path: "{{ service_grafana_config_key_file_path }}"
        tls_web_proxy_service_config_dh_file_path: "{{ service_grafana_config_dh_file_path }}"
        tls_web_proxy_service_config_ca_cert_file_path: "{{ service_grafana_config_ca_cert_file_path }}"
        tls_web_proxy_service_config_network_dns: "{{ service_grafana_service_network_dns }}"
        tls_web_proxy_service_config_reverse_proxy_additional_headers: "{{ service_grafana_config_reverse_proxy_additional_headers }}"
        tls_web_proxy_service_config_reverse_proxy_enable_web_socket: "{{ service_grafana_config_reverse_proxy_enable_web_socket }}"
        tls_web_proxy_service_config_http_gateway: "{{ service_grafana_config_http_gateway }}"

    - name: Service (grafana) - openid facts
      ansible.builtin.include_role:
        name: openid_service_init
      vars:
        openid_service_init_client_id: "{{ service_grafana_openid_client_id }}"
        openid_service_init_base_uri: "{{ service_grafana_openid_base_uri }}"

    - name: Service (grafana) - database configuration
      ansible.builtin.include_role:
        name: service_postgresql_init
      vars:
        service_postgresql_init_service_name: "{{ service_grafana_service_name }}"
        service_postgresql_init_service_config_dir: "{{ service_grafana_service_config_dir }}"
        service_postgresql_init_pgsql_db: "{{ service_grafana_pgsql_db }}"
        service_postgresql_init_pgsql_user: "{{ service_grafana_pgsql_user }}"
        service_postgresql_init_enable_pg_trgm_extension: "{{ service_grafana_pgsql_enable_pg_trgm_extension }}"

    - name: Service (grafana) - locations.conf
      ansible.builtin.template:
        src: "service_grafana_locations.conf.j2"
        dest: "{{ service_grafana_config_locations_server_path }}"
        owner: "{{ fact_tls_web_proxy_config_uid }}"
        group: "{{ fact_tls_web_proxy_config_gid }}"
        mode: "{{ fact_tls_web_proxy_config_conf_file_mode }}"
        force: true
      vars:
        service_uri: "{{ service_grafana_service_uri }}"
        openid_user_pod: "{{ service_grafana_openid_user_pod }}"
        server_url: "{{ service_grafana_server_url }}"
        includes_path_reverse_proxy_conf: "{{ service_grafana_reverse_proxy_conf_container_path }}"

    - name: Service (grafana) - grafana_podman_environment
      ansible.builtin.template:
        src: "service_grafana_grafana_podman_environment.j2"
        dest: "{{ service_grafana_grafana_podman_environment_server_path }}"
        owner: "{{ fact_tls_web_proxy_config_uid }}"
        group: "{{ fact_tls_web_proxy_config_gid }}"
        mode: "{{ fact_tls_web_proxy_config_conf_file_mode }}"
        force: true
      vars:
        server_domain: "{{ service_grafana_server_domain }}"
        https_root_url: "{{ service_grafana_https_root_url }}"
        host_with_port: "{{ service_grafana_host_with_port }}"
        pgsql_db: "{{ service_grafana_pgsql_db }}"
        pgsql_user: "{{ service_grafana_pgsql_user }}"
        pgsql_password_file_path: "{{ service_grafana_pgsql_user_password_file_path }}"
        admin_user: "{{ service_grafana_admin_user }}"
        admin_user_password_file_path: "{{ service_grafana_admin_user_password_file_path }}"
        admin_email: "{{ service_grafana_admin_email }}"
        openid_client_id: "{{ service_grafana_openid_client_id }}"
        openid_client_secret_file_path: "{{ service_grafana_openid_client_secret_file_path }}"
        openid_auth_url: "{{ service_grafana_openid_auth_uri }}"
        openid_token_url: "{{ service_grafana_openid_token_uri }}"
        openid_api_url: "{{ service_grafana_openid_api_uri }}"
        openid_scopes: "{{ service_grafana_openid_scopes }}"

    - name: Service (grafana) - deploy service
      ansible.builtin.include_role:
        name: oci_container_service
      vars:
        oci_container_service_config: "{{ service_grafana_oci_service }}"
        oci_container_service_workers: "{{ service_grafana_oci_service_workers }}"
