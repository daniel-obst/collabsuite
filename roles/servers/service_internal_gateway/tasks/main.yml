---
- name: Service internal gateway
  when: facts_machine_linux_distro
  block:
    - name: Service (internal gateway) - TLS web proxy configuration
      tags: [services_internal_gateway_deploy]
      ansible.builtin.include_role:
        name: openid_tls_web_proxy_config
      vars:
        openid_tls_web_proxy_config_server_firewall_port: "{{ service_internal_gateway_server_firewall_port }}"
        openid_tls_web_proxy_config_fqdn_server: "{{ service_internal_gateway_fqdn_server }}"
        openid_tls_web_proxy_config_cert_file_path: "{{ service_internal_gateway_config_cert_file_path }}"
        openid_tls_web_proxy_config_key_file_path: "{{ service_internal_gateway_config_key_file_path }}"
        openid_tls_web_proxy_config_dh_file_path: "{{ service_internal_gateway_config_dh_file_path }}"
        openid_tls_web_proxy_config_ca_cert_file_path: "{{ service_internal_gateway_config_ca_cert_file_path }}"
        openid_tls_web_proxy_config_service_network_dns: "{{ service_internal_gateway_service_network_dns }}"
        openid_tls_web_proxy_config_x_host: "{{ service_internal_gateway_config_x_host }}"
        openid_tls_web_proxy_config_reverse_proxy_additional_headers: "{{ service_internal_gateway_config_reverse_proxy_additional_headers }}"
        openid_tls_web_proxy_config_reverse_proxy_enable_web_socket: "{{ service_internal_gateway_config_reverse_proxy_enable_web_socket }}"
        openid_tls_web_proxy_config_set_deny_root_uri_location: "{{ service_internal_gateway_config_set_deny_root_uri_location }}"
        openid_tls_web_proxy_config_enable_session_cache: "{{ service_internal_gateway_config_enable_session_cache }}"
        openid_tls_web_proxy_config_session_cache_domain: "{{ service_internal_gateway_config_session_cache_domain }}"
        openid_tls_web_proxy_config_cache_session_secret_file_path: "{{ service_internal_gateway_config_cache_session_secret_file_path }}"
        openid_tls_web_proxy_config_client_id: "{{ service_internal_gateway_config_client_id }}"
        openid_tls_web_proxy_config_base_uri: "{{ service_internal_gateway_config_base_uri }}"
        openid_tls_web_proxy_config_client_enable_login: "{{ service_internal_gateway_config_client_enable_login }}"
        openid_tls_web_proxy_config_cache_shared_memory_zone_mb: "{{ service_internal_gateway_config_cache_shared_memory_zone_mb }}"
        openid_tls_web_proxy_config_cache_idling_timeout_seconds: "{{ service_internal_gateway_config_cache_idling_timeout_seconds }}"
        openid_tls_web_proxy_config_cache_rolling_timeout_seconds: "{{ service_internal_gateway_config_cache_rolling_timeout_seconds }}"

    - name: Service (internal gateway) - reset facts
      tags: [services_internal_gateway_deploy]
      set_fact:
        service_internal_gateway_upstream_urls: []

    - name: Service (internal gateway) - set facts
      tags: [services_internal_gateway_deploy]
      set_fact:
        service_internal_gateway_upstream_urls:
          "{{ (service_internal_gateway_upstream_urls | default([]))
          + [{
          'location_uri': item.location_uri,
          'upstream_url': 'https://' + item.upstream_server + ':' + item.upstream_server_firewall_port,
          'url_rewrite': item.url_rewrite
          }] }}"
      loop: "{{ service_internal_gateway_config_upstream_services }}"

    - name: Service (internal gateway) - locations.conf
      tags: [services_internal_gateway_deploy]
      ansible.builtin.template:
        src: "service_internal_gateway_locations.conf.j2"
        dest: "{{ service_internal_gateway_locations_conf_server_path }}"
        owner: "{{ fact_openid_tls_web_proxy_config_uid }}"
        group: "{{ fact_openid_tls_web_proxy_config_gid }}"
        mode: "{{ fact_openid_tls_web_proxy_config_conf_file_mode }}"
        force: true
      vars:
        upstream_services: "{{ service_internal_gateway_upstream_urls }}"
        reverse_proxy_conf_path: "{{ service_internal_gateway_config_reverse_proxy_conf_container_path }}"
        http_header_authorization: "{{ service_internal_gateway_http_header_authorization }}"
        http_header_authorization_value: "{{ service_internal_gateway_http_header_authorization_value }}"
        http_header_email: "{{ service_internal_gateway_http_header_email }}"
        http_header_email_value: "{{ service_internal_gateway_http_header_value }}"

    - name: Service (internal gateway) - deploy service
      tags: [services_internal_gateway_deploy]
      ansible.builtin.include_role:
        name: oci_container_service
      vars:
        oci_container_service_config: "{{ service_internal_gateway_oci_service }}"
        oci_container_service_workers: "{{ service_internal_gateway_oci_service_workers }}"
