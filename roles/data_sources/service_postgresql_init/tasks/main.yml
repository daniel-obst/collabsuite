---
- name: Service (postgresql) - init
  when: facts_machine_linux_distro
  block:
    - name: Service (postgresql) - container service init
      ansible.builtin.include_role:
        name: oci_container_service_init
      vars:
        oci_container_service_init_username: "{{ service_postgresql_init_username | ansible.builtin.mandatory }}"
        oci_container_service_init_process_service_cert: "{{ service_postgresql_init_process_service_cert }}"
