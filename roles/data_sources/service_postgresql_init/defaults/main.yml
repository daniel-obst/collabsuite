---
service_postgresql_init_config_uid: "{{ ansible_user_uid }}"
service_postgresql_init_config_gid: "{{ ansible_user_gid }}"
service_postgresql_init_conf_file_mode: "{{ gv_service_conf_file_mode }}"
service_postgresql_init_executable_file_mode: "{{ gv_service_conf_executable_file_mode }}"

service_postgresql_init_port: "5432"
service_postgresql_init_enable_pg_trgm_extension: false
