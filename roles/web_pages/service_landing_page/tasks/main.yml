---
- name: Service (landing page)
  when: facts_machine_linux_distro
  block:
    - name: Service (landing page) - reset facts
      set_fact:
        service_landing_page_urls: {}

    - name: Service (landing page) - set facts
      set_fact:
        service_landing_page_urls: "{{ service_landing_page_urls 
          | combine({item.location_uri + '_url': '/' + item.location_uri + '/'}) }}"
      loop: "{{ service_landing_page_upstream_services }}"

    - name: Service (landing page) - index.html
      ansible.builtin.template:
        src: "service_landing_page_index.html.j2"
        dest: "{{ service_landing_page_html_dir }}/index.html"
        owner: "{{ service_landing_page_user_uid }}"
        group: "{{ service_landing_page_user_gid }}"
        mode: "{{ service_landing_page_html_file_mode }}"
        force: true
      vars:
        platform_title: "{{ service_landing_page_platform_title }}"
        logout_url: "{{ service_landing_page_logout_url }}"
        services_urls: "{{ service_landing_page_urls }}"

    - name: Service (landing page) - images directory
      ansible.builtin.file:
        path: "{{ service_landing_page_images_dir }}"
        state: directory
        owner: "{{ service_landing_page_user_uid }}"
        group: "{{ service_landing_page_user_gid }}"
        mode: "{{ service_landing_page_images_dir_mode }}"

    - name: Service (landing page) - images
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ service_landing_page_images_dir }}"
        owner: "{{ service_landing_page_user_uid }}"
        group: "{{ service_landing_page_user_gid }}"
        mode: "{{ service_landing_page_images_file_mode }}"
        force: true
      loop: "{{ service_landing_page_images }}"
