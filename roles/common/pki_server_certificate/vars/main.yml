---
pki_server_certificate_san_dns: "DNS:{{ (pki_server_certificate_fqdn_server | ansible.builtin.mandatory) }}"

pki_server_certificate_san_ip: "{{ (pki_server_certificate_server_ip is ansible.utils.ipv4)
  | ansible.builtin.ternary(',IP:' + pki_server_certificate_server_ip, '') }}"

pki_server_certificate_subject_alt_name: "{{ pki_server_certificate_san_dns }}{{ pki_server_certificate_san_ip }}"

pki_server_certificate_cmd:
  "export EASYRSA_KEY_SIZE={{ pki_server_certificate_default_key_size }};
  export EASYRSA_CERT_EXPIRE={{ pki_server_certificate_cert_expire_in_days }};
  export EASYRSA_DN='cn_only';
  export EASYRSA_BATCH=1;
  {{ pki_server_certificate_easyrsa_binary }}
  --subject-alt-name='{{ pki_server_certificate_subject_alt_name }}'
  --passin=file:{{ pki_server_certificate_ca_password_file | ansible.builtin.mandatory }}
  build-server-full {{ pki_server_certificate_fqdn_server | ansible.builtin.mandatory }} nopass"
