---
- name: PKI server certificate
  when: facts_machine_linux_distro
  block:
    - name: PKI server certificate - generate server certificate and sign by CA
      ansible.builtin.shell:
        cmd: "{{ pki_server_certificate_cmd }}"
        creates: "{{ pki_server_certificate_pki_dir }}/private/{{ pki_server_certificate_fqdn_server }}.key"
        chdir: "{{ pki_server_certificate_easyrsa_dir }}"
      args:
        executable: "{{ facts_machine_linux_default_shell }}"
