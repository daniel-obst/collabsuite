---
- name: OCI container runtime
  when: facts_machine_linux_distro
  block:
    - name: OCI container runtime - remove docker runtime (if installed)
      when: facts_machine_linux_use_apt
      ansible.builtin.apt:
        pkg:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: OCI container runtime - install podman runtime
      when: facts_machine_linux_use_apt
      ansible.builtin.apt:
        name: podman
        state: present
