---
- name: PKI certificate authority info - facts for CA files
  ansible.builtin.set_fact:
    fact_pki_certificate_authority_info_dh_file: "{{ pki_certificate_authority_info_dh_file }}"
    fact_pki_certificate_authority_info_ca_file: "{{ pki_certificate_authority_info_ca_file }}"
    fact_pki_certificate_authority_info_machine_ca_filename: "{{ pki_certificate_authority_info_ca_filename }}"
