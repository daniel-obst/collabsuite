---
- name: TLS (web proxy config)
  when: facts_machine_linux_distro
  block:
    - name: TLS (web proxy config) - HTML error pages
      ansible.builtin.import_tasks: linux_error_pages.yml

    - name: TLS (web proxy config) - TLS configuration
      ansible.builtin.include_role:
        name: tls_config
      vars:
        tls_config_pki_cert_file_path: "{{ tls_web_proxy_config_cert_file_path }}"
        tls_config_pki_key_file_path: "{{ tls_web_proxy_config_key_file_path }}"
        tls_config_pki_dh_file_path: "{{ tls_web_proxy_config_dh_file_path | default(None) }}"
        tls_config_pki_ca_cert_file_path: "{{ tls_web_proxy_config_ca_cert_file_path }}"

    - name: TLS (web proxy config) - configuration files (primary)
      when: tls_web_proxy_config_set_config_files
      ansible.builtin.import_tasks: linux_primary_configuration_files.yml

    - name: TLS (web proxy config) - secondary configuration (optional)
      when: tls_web_proxy_config_enable_secondary
      block:
        - name: TLS (web proxy config) - TLS configuration (secondary)
          ansible.builtin.include_role:
            name: tls_config
          vars:
            tls_config_pki_cert_file_path: "{{ tls_web_proxy_config_secondary_cert_file_path }}"
            tls_config_pki_key_file_path: "{{ tls_web_proxy_config_secondary_key_file_path }}"
            tls_config_pki_dh_file_path: "{{ tls_web_proxy_config_secondary_dh_file_path | default(None) }}"
            tls_config_pki_ca_cert_file_path: "{{ tls_web_proxy_config_secondary_ca_cert_file_path }}"

        - name: TLS (web proxy config) - configuration files (secondary)
          ansible.builtin.import_tasks: linux_secondary_configuration_files.yml

    - name: TLS (web proxy config) - set facts
      ansible.builtin.set_fact:
        fact_tls_web_proxy_config_uid: "{{ tls_web_proxy_config_user_uid }}"
        fact_tls_web_proxy_config_gid: "{{ tls_web_proxy_config_user_gid }}"

        fact_tls_web_proxy_config_dir: "{{ tls_web_proxy_config_conf_dir }}"
        fact_tls_web_proxy_config_conf_dir_mode: "{{ tls_web_proxy_config_conf_dir_mode }}"
        fact_tls_web_proxy_config_conf_file_mode: "{{ tls_web_proxy_config_conf_file_mode }}"

        fact_tls_web_proxy_config_includes_dir: "{{ tls_web_proxy_config_includes_dir }}"
        fact_tls_web_proxy_config_includes_dir_mode: "{{ tls_web_proxy_config_includes_dir_mode }}"
        fact_tls_web_proxy_config_includes_file_mode: "{{ tls_web_proxy_config_includes_file_mode }}"

        fact_tls_web_proxy_config_html_dir: "{{ tls_web_proxy_config_html_dir }}"
        fact_tls_web_proxy_config_html_dir_mode: "{{ tls_web_proxy_config_html_dir_mode }}"
        fact_tls_web_proxy_config_html_file_mode: "{{ tls_web_proxy_config_html_file_mode }}"

        fact_tls_web_proxy_config_includes_locations_config_server_path: "{{ tls_web_proxy_config_includes_locations_config_server_path }}"
        fact_tls_web_proxy_config_includes_locations_config_path: "{{ tls_web_proxy_config_includes_locations_config_path }}"
        fact_tls_web_proxy_config_includes_html_error_pages_conf_path: "{{ tls_web_proxy_config_includes_html_error_pages_conf_path }}"
        fact_tls_web_proxy_config_secondary_includes_html_error_pages_conf_path: "{{ tls_web_proxy_config_secondary_includes_html_error_pages_conf_path }}"

        fact_tls_web_proxy_config_tls_dir: "{{ tls_web_proxy_config_tls_dir }}"
        fact_tls_web_proxy_config_server_cert_file_path: "{{ tls_web_proxy_config_server_cert_file_path }}"
        fact_tls_web_proxy_config_server_key_file_path: "{{ tls_web_proxy_config_server_key_file_path }}"
        fact_tls_web_proxy_config_server_dh_file_path: "{{ tls_web_proxy_config_server_dh_file_path }}"
        fact_tls_web_proxy_config_server_ca_cert_file_path: "{{ tls_web_proxy_config_server_ca_cert_file_path }}"

        fact_tls_web_proxy_config_container_includes_dir_path: "{{ tls_web_proxy_config_container_includes_dir_path }}"
        fact_tls_web_proxy_config_reverse_proxy_conf_container_path: "{{ tls_web_proxy_config_reverse_proxy_conf_container_path }}"
        fact_tls_web_proxy_config_readonly_volumes: "{{ tls_web_proxy_config_readonly_volumes + fact_tls_config_readonly_volumes }}"
