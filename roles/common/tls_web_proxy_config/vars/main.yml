---
tls_web_proxy_config_user_uid: "{{ fact_oci_container_service_directories_uid }}"
tls_web_proxy_config_user_gid: "{{ fact_oci_container_service_directories_gid }}"

tls_web_proxy_config_conf_dir: "{{ fact_oci_container_service_directories_conf_dir }}"
tls_web_proxy_config_conf_dir_mode: "{{ fact_oci_container_service_directories_conf_dir_mode }}"
tls_web_proxy_config_conf_file_mode: "{{ fact_oci_container_service_directories_conf_file_mode }}"

tls_web_proxy_config_includes_dir: "{{ fact_oci_container_service_directories_includes_dir }}"
tls_web_proxy_config_includes_dir_mode: "{{ fact_oci_container_service_directories_includes_dir_mode }}"
tls_web_proxy_config_includes_file_mode: "{{ fact_oci_container_service_directories_includes_file_mode }}"

tls_web_proxy_config_html_dir: "{{ fact_oci_container_service_directories_html_dir }}"
tls_web_proxy_config_html_dir_mode: "{{ fact_oci_container_service_directories_html_dir_mode }}"
tls_web_proxy_config_html_file_mode: "{{ fact_oci_container_service_directories_html_file_mode }}"

tls_web_proxy_config_tls_dir: "{{ fact_tls_config_tls_dir }}"

tls_web_proxy_config_container_conf_dir_path: "/etc/nginx/conf.d"
tls_web_proxy_config_container_includes_dir_path: "/etc/nginx/includes"
tls_web_proxy_config_container_tls_dir_path: "/etc/nginx/tls"

tls_web_proxy_config_reverse_proxy_conf: "playbooks_templates_nginx_reverse_proxy.conf"
tls_web_proxy_config_playbooks_files_html_error_pages_conf: "playbooks_files_nginx_html_error_pages.conf"
tls_web_proxy_config_html_error_pages_conf: "nginx_html_error_pages.conf"

tls_web_proxy_config_default_conf_filename: "tls_web_proxy_config_default.conf.j2"
tls_web_proxy_config_dest_default_conf_path: "{{ tls_web_proxy_config_conf_dir }}/default.conf"

tls_web_proxy_config_dest_reverse_proxy_conf_path: "{{ tls_web_proxy_config_includes_dir }}/reverse_proxy.conf"
tls_web_proxy_config_reverse_proxy_conf_container_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/reverse_proxy.conf"

tls_web_proxy_config_dest_html_error_pages:
  - path: "{{ tls_web_proxy_config_playbooks_files_html_error_pages_conf }}"
    dest: "{{ tls_web_proxy_config_includes_dir }}/{{ tls_web_proxy_config_html_error_pages_conf }}"

tls_web_proxy_config_base_error_html: "playbooks_templates_base_error.html.j2"

tls_web_proxy_config_dest_html_40x_error_page_dest: "{{ tls_web_proxy_config_html_dir }}/40x.html"
tls_web_proxy_config_dest_html_40x_error_page_contents: |
    '<div class="content">
      <h1>Unauthorized</h1>
      <div class="row">
        <div class="column">
          <div class="card">
            <h2>Page Currently Off-Limits</h2>
            <div class="readonly">
              <p>Please contact support if you have any questions.
            </div>
            <p>
              <a href="/">
                <button>Back to Home Page</button>
              </a>
            </p>
            </div>
          </div>
      </div>
    </div>'

tls_web_proxy_config_dest_html_404_error_page_dest: "{{ tls_web_proxy_config_html_dir }}/404.html"
tls_web_proxy_config_dest_html_404_error_page_contents: |
    '<div class="content">
      <h1>Page Not Found</h1>
      <div class="row">
        <div class="column">
          <div class="card">
            <h2>Page Temporarily Unavailable</h2>
            <div class="readonly">
              <p>Please contact support if you have any questions.
            </div>
            <p>
              <a href="/">
                <button>Back to Home Page</button>
              </a>
            </p>
            </div>
          </div>
      </div>
    </div>'

tls_web_proxy_config_dest_html_500_error_page_dest: "{{ tls_web_proxy_config_html_dir }}/500.html"
tls_web_proxy_config_dest_html_500_error_page_contents: |
    '<div class="content">
      <h1>Something Went Wrong</h1>
      <div class="row">
        <div class="column">
          <div class="card">
            <h2>Working To Fix The Issue</h2>
            <div class="readonly">
              <p>We expect to have things back up and running soon.</p>
              <p>Please contact support if you have any questions.
            </div>
            <p>
              <a href="/">
                <button>Back to Home Page</button>
              </a>
            </p>
            </div>
          </div>
      </div>
    </div>'

tls_web_proxy_config_dest_html_50x_error_page_dest: "{{ tls_web_proxy_config_html_dir }}/50x.html"
tls_web_proxy_config_dest_html_50x_error_page_contents: |
    '<div class="content">
      <h1>Something Went Wrong</h1>
      <div class="row">
        <div class="column">
          <div class="card">
            <h2>Working To Fix The Issue</h2>
            <div class="readonly">
              <p>We expect to have things back up and running soon.</p>
              <p>Please contact support if you have any questions.
            </div>
            <p>
              <a href="/">
                <button>Back to Home Page</button>
              </a>
            </p>
            </div>
          </div>
      </div>
    </div>'

tls_web_proxy_config_readonly_volumes:
  - "./{{ tls_web_proxy_config_dest_default_conf_path }}:{{ tls_web_proxy_config_container_conf_dir_path }}/default.conf"
  - "./{{ tls_web_proxy_config_includes_dir }}/:{{ tls_web_proxy_config_container_includes_dir_path }}"
  - "./{{ tls_web_proxy_config_html_dir }}:/usr/share/nginx/html"

tls_web_proxy_config_server_cert_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_cert_file_path | basename }}"
tls_web_proxy_config_server_key_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_key_file_path | basename }}"
tls_web_proxy_config_server_dh_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_dh_file_path | basename }}"
tls_web_proxy_config_server_ca_cert_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_ca_cert_file_path | basename }}"
tls_web_proxy_config_includes_locations_config_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/locations.conf"
tls_web_proxy_config_includes_html_error_pages_conf_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/{{ tls_web_proxy_config_html_error_pages_conf }}"

# Secondary site configuration
tls_web_proxy_config_dest_secondary_default_conf_path: "{{ tls_web_proxy_config_conf_dir }}/default_secondary.conf"
tls_web_proxy_config_dest_secondary_reverse_proxy_conf_path: "{{ tls_web_proxy_config_includes_dir }}/reverse_proxy_secondary.conf"
tls_web_proxy_config_secondary_reverse_proxy_conf_container_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/reverse_proxy_secondary.conf"
tls_web_proxy_config_secondary_includes_locations_config_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/locations_secondary.conf"
tls_web_proxy_config_secondary_includes_html_error_pages_conf_path: "{{ tls_web_proxy_config_container_includes_dir_path }}/{{ tls_web_proxy_config_html_error_pages_conf }}"

tls_web_proxy_config_secondary_server_cert_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_secondary_cert_file_path | basename }}"
tls_web_proxy_config_secondary_server_key_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_secondary_key_file_path | basename }}"
tls_web_proxy_config_secondary_server_dh_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_secondary_dh_file_path | basename }}"
tls_web_proxy_config_secondary_server_ca_cert_file_path: "{{ tls_web_proxy_config_container_tls_dir_path }}/{{ tls_web_proxy_config_secondary_ca_cert_file_path | basename }}"
