---
tls_web_proxy_service_config_gateway: "{{ tls_web_proxy_service_config_http_gateway | ansible.builtin.mandatory }}"

tls_web_proxy_service_config_x_host: "{{ tls_web_proxy_service_config_gateway.server_ip }}"
tls_web_proxy_service_config_x_host_with_port:
  "{{ tls_web_proxy_service_config_gateway.server_ip }}:{{ tls_web_proxy_service_config_gateway.port }}"
tls_web_proxy_service_config_x_forwarded_port:
  "{{ tls_web_proxy_service_config_set_x_forwarded_port 
  | ansible.builtin.ternary(tls_web_proxy_service_config_gateway.port, default(None)) }}"
