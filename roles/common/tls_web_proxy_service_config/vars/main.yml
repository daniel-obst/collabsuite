---
tls_web_proxy_service_config_gateway: "{{ tls_web_proxy_service_config_http_gateway | ansible.builtin.mandatory }}"

tls_web_proxy_service_config_x_host: "{{ tls_web_proxy_service_config_gateway.domain_web }}"

tls_web_proxy_service_config_x_host_with_port:
  "{{ tls_web_proxy_service_config_reverse_proxy_set_host_with_port
    | ansible.builtin.ternary(tls_web_proxy_service_config_gateway.domain_web + ':' + tls_web_proxy_service_config_gateway.port, default(None)) }}"

tls_web_proxy_service_config_x_forwarded_port:
  "{{ tls_web_proxy_service_config_set_x_forwarded_port 
  | ansible.builtin.ternary(tls_web_proxy_service_config_gateway.port, default(None)) }}"
tls_web_proxy_service_config_includes_locations_config_server_path: "{{ fact_tls_web_proxy_config_includes_locations_config_server_path }}"
