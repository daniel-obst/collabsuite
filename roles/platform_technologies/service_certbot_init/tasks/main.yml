---
- name: Service (certbot) - init
  when: facts_machine_linux_distro
  block:
    - name: Service (certbot) - container service init
      ansible.builtin.include_role:
        name: oci_container_service_init
      vars:
        oci_container_service_init_username: "{{ service_certbot_init_username }}"
        oci_container_service_init_process_service_cert: "{{ service_certbot_init_process_service_cert }}"
