---
service_rstudio_config: "{{ ansible_deploy_production
  | ansible.builtin.ternary(platform_service_rstudio.production, platform_service_rstudio.staging) }}"

service_rstudio_config_http_gateway: "{{ service_rstudio_config.http_gateway }}"

service_rstudio_env_prefix: "rstudio_"

# web proxy config
service_rstudio_server_firewall_port: "{{ service_rstudio_config.firewall_port }}"
service_rstudio_fqdn_server: "{{ service_rstudio_config.fqdn_server }}"
service_rstudio_service_network_dns: "{{ platform_oci_container_service_globals.network_dns }}"
service_rstudio_config_cert_file_path: "{{ fact_oci_container_service_init_cert_file }}"
service_rstudio_config_key_file_path: "{{ fact_oci_container_service_init_key_file }}"
service_rstudio_config_dh_file_path: "{{ fact_oci_container_service_init_dh_file }}"
service_rstudio_config_ca_cert_file_path: "{{ fact_oci_container_service_init_ca_cert_file }}"

service_rstudio_config_reverse_proxy_additional_headers:
  - http_header: "X-RStudio-Root-Path"
    value: "/{{ service_rstudio_config.service_uri }}"
service_rstudio_config_reverse_proxy_enable_web_socket: true

# locations.conf
service_rstudio_service_uri: "{{ service_rstudio_config.service_uri }}"
service_rstudio_server_url: "http://${{ gv_openid_http_header_authorization_value }}:8787"
service_rstudio_config_reverse_proxy_conf_container_path: "{{ fact_tls_web_proxy_service_config_reverse_proxy_conf_container_path }}"
service_rstudio_config_locations_server_path: "{{ fact_tls_web_proxy_service_config_includes_dir }}/locations.conf"

# podman_environment
service_rstudio_default_password_file_path: "{{ platform_management_passwords_path }}/{{ service_rstudio_env_prefix }}{{ service_rstudio_config.username }}"
service_rstudio_config_podman_environment_server_path: "{{ fact_tls_web_proxy_service_config_dir }}/podman_environment"

# seed users
service_rstudio_users_seed_file_path: "{{ platform_management_seed_users_file_path }}"

# service
service_rstudio_oci_service:
  image_name: "{{ service_rstudio_config.service_image_name }}"
  image_tag: "{{ service_rstudio_config.service_image_tag }}"
  service_name: "{{ service_rstudio_config.service_account.username }}"
  server_dest_port: "{{ service_rstudio_config.server_port }}"
  container_dest_port: "{{ service_rstudio_config.firewall_port }}"
  volumes: []
  readonly_volumes: "{{ fact_tls_web_proxy_config_readonly_volumes }}"
  env_file: ""
  added_capabilities: []

service_rstudio_oci_service_workers:
  - image_name: "{{ service_rstudio_config.worker_image_name }}"
    image_tag: "{{ service_rstudio_config.worker_image_tag }}"
    env_file: "{{ service_rstudio_config_podman_environment_server_path }}"
    added_capabilities: []
