---
- name: Service (rstudio)
  when: facts_machine_linux_distro
  block:
    - name: Service (rstudio) - TLS web proxy configuration
      ansible.builtin.include_role:
        name: openid_tls_web_proxy_service_config
      vars:
        openid_tls_web_proxy_service_config_server_firewall_port: "{{ service_rstudio_server_firewall_port }}"
        openid_tls_web_proxy_service_config_fqdn_server: "{{ service_rstudio_fqdn_server }}"
        openid_tls_web_proxy_service_config_cert_file_path: "{{ service_rstudio_config_cert_file_path }}"
        openid_tls_web_proxy_service_config_key_file_path: "{{ service_rstudio_config_key_file_path }}"
        openid_tls_web_proxy_service_config_dh_file_path: "{{ service_rstudio_config_dh_file_path }}"
        openid_tls_web_proxy_service_config_ca_cert_file_path: "{{ service_rstudio_config_ca_cert_file_path }}"
        openid_tls_web_proxy_service_config_service_network_dns: "{{ service_rstudio_config_service_network_dns }}"
        openid_tls_web_proxy_service_config_reverse_proxy_additional_headers: "{{ service_rstudio_config_reverse_proxy_additional_headers }}"
        openid_tls_web_proxy_service_config_reverse_proxy_enable_web_socket: "{{ service_rstudio_config_reverse_proxy_enable_web_socket }}"
        openid_tls_web_proxy_service_config_http_gateway: "{{ service_rstudio_config_http_gateway }}"
        openid_tls_web_proxy_service_config_openid_client: "{{ service_rstudio_config_openid_client }}"

    - name: Service (rstudio) - locations.conf
      ansible.builtin.template:
        src: "service_rstudio_locations.conf.j2"
        dest: "{{ service_rstudio_config_locations_server_path }}"
        owner: "{{ service_rstudio_config_user_uid }}"
        group: "{{ service_rstudio_config_user_gid }}"
        mode: "{{ service_rstudio_config_conf_file_mode }}"
        force: true
      vars:
        service_uri: "{{ service_rstudio_service_uri }}"
        openid_user_pod: "{{ service_rstudio_openid_user_pod }}"
        server_url: "{{ service_rstudio_server_url }}"
        includes_path_reverse_proxy_conf: "{{ service_rstudio_config_reverse_proxy_conf_container_path }}"

    - name: Service (rstudio) - podman_environment
      ansible.builtin.template:
        src: "service_rstudio_podman_environment.j2"
        dest: "{{ service_rstudio_config_podman_environment_server_path }}"
        owner: "{{ service_rstudio_config_user_uid }}"
        group: "{{ service_rstudio_config_user_gid }}"
        mode: "{{ service_rstudio_config_conf_file_mode }}"
        force: true
      vars:
        rstudio_default_password_file_path: "{{ service_rstudio_default_password_file_path }}"

    - name: Service (rstudio) - seed users (load)
      ansible.builtin.include_vars:
        file: "{{ service_rstudio_users_seed_file_path }}"
        name: service_rstudio_users_config

    - name: Service (rstudio) - reset fact (users init)
      set_fact:
        service_rstudio_users_init: []

    - name: Service (rstudio) - set facts
      ansible.builtin.set_fact:
        service_rstudio_service_worker_containers:
          "{{ service_rstudio_service_worker_containers | default([])
          + [{'container_name': item.id,
          'volumes': [item.id + '_config:/home/rstudio/.config/rstudio', item.id + '_workspace:/home/rstudio/workspace'],
          'readonly_volumes': []}]
          }}"
      loop: "{{ service_rstudio_users_config.seed_users }}"

    - name: Service (rstudio) - deploy service
      ansible.builtin.include_role:
        name: oci_container_service
      vars:
        oci_container_service_config: "{{ service_rstudio_oci_service }}"
        oci_container_service_workers: 
          "[{{ service_rstudio_oci_service_workers[0]
          | ansible.builtin.combine({'containers': service_rstudio_service_worker_containers}) }}]"
