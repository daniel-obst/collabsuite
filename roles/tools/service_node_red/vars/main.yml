---
service_node_red_config: "{{ ansible_deploy_production
  | ansible.builtin.ternary(platform_service_node_red.production, platform_service_node_red.staging) }}"

service_node_red_openid_config: "{{ service_node_red_config.openid_client }}"

service_node_red_config_http_gateway: "{{ service_node_red_config.http_gateway }}"

service_node_red_service_name: "node_red"
service_node_red_password_path_prefix: "{{ platform_management_passwords_path }}/{{ service_node_red_service_name }}_"

# web proxy config
service_node_red_server_firewall_port: "{{ service_node_red_config.firewall_port }}"
service_node_red_fqdn_server: "{{ service_node_red_config.fqdn_server }}"
service_node_red_config_network_dns: "{{ platform_oci_container_service_globals.network_dns }}"
service_node_red_config_cert_file_path: "{{ fact_oci_container_service_init_cert_file }}"
service_node_red_config_key_file_path: "{{ fact_oci_container_service_init_key_file }}"
service_node_red_config_dh_file_path: "{{ fact_oci_container_service_init_dh_file }}"
service_node_red_config_ca_cert_file_path: "{{ fact_oci_container_service_init_ca_cert_file }}"
service_node_red_config_reverse_proxy_additional_headers: []
service_node_red_config_reverse_proxy_enable_web_socket: true
service_node_red_config_set_deny_root_uri_location: true

# service_node_red_config_enable_session_cache: "{{ service_node_red_openid_config.enable_session_cache }}"
# service_node_red_config_session_cache_domain: "{{ service_node_red_openid_config.domain }}"
# service_node_red_config_cache_session_secret_file_path: "{{ service_node_red_password_path_prefix }}session_cache"

# service_node_red_config_client_id: "{{ service_node_red_openid_config.client_id }}"
# service_node_red_config_client_secret_file_path: "{{ service_node_red_openid_config.secret_file_path }}"
# service_node_red_config_redirect_uri: "{{ service_node_red_openid_config.redirect_uri }}"
# service_node_red_config_client_enable_login: false
# service_node_red_config_cache_shared_memory_zone_mb: "{{ service_node_red_openid_config.shared_memory_zone_mb }}"
# service_node_red_config_cache_idling_timeout_seconds: "{{ service_node_red_openid_config.idling_timeout_seconds }}"
# service_node_red_config_cache_rolling_timeout_seconds: "{{ service_node_red_openid_config.rolling_timeout_seconds }}"

# locations.conf
service_node_red_service_uri: "{{ service_node_red_config.service_uri }}"
service_node_red_server_url: "http://${{ gv_openid_http_header_authorization_value }}:1880"
service_node_red_config_reverse_proxy_conf_container_path: "{{ fact_tls_web_proxy_config_reverse_proxy_conf_container_path }}"
service_node_red_config_locations_server_path: "{{ fact_tls_web_proxy_service_config_includes_dir }}/locations.conf"

# settings.js
service_node_red_config_settings_js_server_path: "{{ fact_tls_web_proxy_service_config_dir }}/settings.js"

# seed users
service_node_red_users_seed_file_path: "{{ platform_management_seed_users_file_path }}"
service_node_red_user_settings_volume: "./{{ fact_tls_web_proxy_service_config_dir }}/settings.js:/data/settings.js"

# service
service_node_red_oci_service:
  image_name: "{{ service_node_red_config.service_image_name }}"
  image_tag: "{{ service_node_red_config.service_image_tag }}"
  service_name: "{{ service_node_red_config.service_account.username }}"
  server_dest_port: "{{ service_node_red_config.server_port }}"
  container_dest_port: "{{ service_node_red_config.firewall_port }}"
  volumes: []
  readonly_volumes: "{{ fact_tls_web_proxy_config_readonly_volumes }}"
  env_file: ""
  added_capabilities: []

service_node_red_oci_service_workers:
  - image_name: "{{ service_node_red_config.worker_image_name }}"
    image_tag: "{{ service_node_red_config.worker_image_tag }}"
    env_file: ""
    added_capabilities: []
